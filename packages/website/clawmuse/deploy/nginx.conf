map $uri $plugin_registry_cors {
  default "";
  ~^/registry/ "*";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;
  # Security headers (always: also on error/redirect responses).
  # HSTS omits includeSubDomains — app./agent-hub./agent-relay. use
  # separate stacks; forcing HSTS on every subdomain from this vhost
  # would be unsafe without verifying each one is HTTPS-only.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Access-Control-Allow-Origin $plugin_registry_cors always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
  location = /healthz { access_log off; return 200 'ok'; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location /registry/ { try_files $uri =404; expires -1; }
  # English moved to the canonical root. Redirect the old prefix so existing
  # bookmarks and campaign links do not land on a missing page.
  location = /en { return 301 /; }
  location /en/ { rewrite ^/en/(.*)$ /$1 permanent; }
  # Prefer $uri/index.html over $uri/ so a directory without index.html
  # returns 404 instead of nginx's default 403 (autoindex off).
  location /zh-TW/ { try_files $uri $uri/index.html =404; error_page 404 /zh-TW/404.html; }
  location /zh/ { try_files $uri $uri/index.html =404; error_page 404 /zh/404.html; }
  location /ar/ { try_files $uri $uri/index.html =404; error_page 404 /ar/404.html; }
  location /es/ { try_files $uri $uri/index.html =404; error_page 404 /es/404.html; }
  location /fr/ { try_files $uri $uri/index.html =404; error_page 404 /fr/404.html; }
  location /ja/ { try_files $uri $uri/index.html =404; error_page 404 /ja/404.html; }
  location /ko/ { try_files $uri $uri/index.html =404; error_page 404 /ko/404.html; }
  location /pt-BR/ { try_files $uri $uri/index.html =404; error_page 404 /pt-BR/404.html; }
  location /ru/ { try_files $uri $uri/index.html =404; error_page 404 /ru/404.html; }
  location / { try_files $uri $uri/index.html =404; }
  error_page 404 /404.html;
}
