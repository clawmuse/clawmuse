appId: sh.paseo.debug
---
# Establish History with the sidebar closed. The host filter then proves a close
# swipe did not activate the row below it.
- tapOn:
    id: "menu-button"
- tapOn:
    id: "sidebar-sessions"
- assertVisible:
    id: "sessions-host-filter-trigger"

# A close swipe over a semantic header row must close without navigating.
- swipe:
    direction: RIGHT
    duration: 300
- assertVisible:
    id: "sidebar-schedules"
- swipe:
    start: "85%,19%"
    end: "10%,19%"
    duration: 300
- assertNotVisible:
    id: "sidebar-schedules"
- assertVisible:
    id: "sessions-host-filter-trigger"

# Project headers inside the nested list still close the panel. Workspace rows
# own archive swipes (native-sidebar-swipe-archive.ios.yaml).
- swipe:
    direction: RIGHT
    duration: 300
- assertVisible:
    id: "sidebar-project-workspace-list-scroll"
- swipe:
    from:
      id: "sidebar-project-row-.*"
      index: 0
    direction: LEFT
    duration: 300
- assertNotVisible:
    id: "sidebar-project-workspace-list-scroll"
- assertVisible:
    id: "sessions-host-filter-trigger"
